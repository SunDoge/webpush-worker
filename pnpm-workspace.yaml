packages:
  - "apps/*"
  - "pkgs/*"

overrides:
  vite: 8.2.2
  sharp: 0.35.0
  sharp-ico: ^0.1.5
  undici: 7.29.0

# Kysely D1's Cloudflare types peer has not yet widened for Workers Types 5.
# Its public D1Database surface remains compatible and is checked by TypeScript below.
peerDependencyRules:
  allowedVersions:
    "@sundoge/kysely-d1>@cloudflare/workers-types": ">=4 <6"

allowBuilds:
  "@biomejs/biome": true
  "@tailwindcss/oxide": true
  better-sqlite3: true
  esbuild: true
  sharp: true
  workerd: true
